version: "3.9"
services:
  sender:
    network_mode: host
    restart: always
    privileged: true # Needed for camera access
    runtime: nvidia # Needed for ZED SDK
    build:
      context: .
      dockerfile: ./sender/Dockerfile
    volumes:
      - ./:/app
      - /dev:/dev
      - /tmp:/tmp
      - /var/nvidia/nvcam/settings/:/var/nvidia/nvcam/settings
      - /etc/systemd/system/zed_x_daemon.service:/etc/systemd/system/zed_x_daemon.service
      - /usr/local/zed/resources:/usr/local/zed/resources
      - /usr/local/zed/settings:/usr/local/zed/settings
      - /sys/bus/i2c/devices:/sys/bus/i2c/devices
      - /sys/class/video4linux:/sys/class/video4linux
    environment:
      - STREAM_PORT=5555
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,compute,utility,video
      - ZED_GMSL2_CAMERA=1
      - ZED_GMSL_CAMERA=1
      - ZED_GMSL_CAMERA_MODE=0
      - ZED_GMSL_CAMERA_RESOLUTION=1080
      - ZED_GMSL_CAMERA_FPS=30
      - ZED_SDK_VERBOSE=1

  receiver:
    network_mode: host
    restart: always
    build:
      context: .
      dockerfile: ./receiver/Dockerfile
    volumes:
      - ./:/app
    environment:
      - STREAM_HOST=localhost
      - STREAM_PORT=5555
      - WEB_PORT=5001
    depends_on:
      - sender
